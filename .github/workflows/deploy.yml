name: Deploy to Azure Web App

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build
        run: npm run build

      - name: Prepare deployment package (exclude node_modules)
        run: |
          mkdir deploy_temp
          cp -r dist deploy_temp/
          cp -r prisma deploy_temp/
          cp package.json deploy_temp/
          cp package-lock.json deploy_temp/
          cp web.config deploy_temp/ 2>/dev/null || true
          # Create .deployment file to trigger npm install on Azure
          echo "SCM_DO_BUILD_DURING_DEPLOYMENT=true" > deploy_temp/.deployment
          cd deploy_temp
          zip -r ../deploy.zip .
          cd ..

      - name: Deploy to Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'agent-auth'
          publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE }}
          package: deploy.zip